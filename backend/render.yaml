services:
  - type: web
    name: teses-juridicas-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false  # cole o JSON completo da service account aqui
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false  # ex: ["https://seu-site.netlify.app"]
